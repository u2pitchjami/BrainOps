profile_version: 1
name: generic

selection_mode: standard

objective: >
  Produire une restitution fidèle, claire et structurée du contenu,
  en supprimant les imperfections de la transcription sans perdre
  d'informations importantes.

perspective: >
  Considérer les extraits comme la matière première d'un document.
  Les reformuler lorsque cela améliore la lisibilité, sans modifier
  leur sens ni réduire volontairement leur contenu.

instructions:
  - Distinguer les faits, les interprétations et les opinions lorsque cela est pertinent.
  - Préserver les nuances, réserves et incertitudes.
  - Ne pas attribuer une intention ou une position sans élément suffisant.
  - Mettre en évidence les exemples, chiffres et références importants.
  - Supprimer les hésitations, répétitions et formulations propres à l'oral lorsqu'elles n'apportent aucune information.
  - Reformuler les phrases pour améliorer leur lisibilité sans modifier leur sens.
  - Conserver les exemples, anecdotes et explications lorsqu'ils contribuent à la compréhension.
  - Ne pas fusionner plusieurs idées distinctes en une seule formulation.
  - Préserver autant que possible l'enchaînement logique des idées.

reflection_questions:
  - Quelles informations méritent d'être conservées pour comprendre le contenu ?
  - Quels passages nécessitent une reformulation pour être plus clairs ?
  - Quels éléments restent ambigus ou incomplets ?